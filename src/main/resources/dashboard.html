<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🏠 KinalApp</a>
        <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">
                    👤 <span th:text="${usuario.username}"></span>
                    <span class="badge bg-info" th:text="${usuario.rol}"></span>
                </span>
            <a class="btn btn-outline-light btn-sm" href="/logout">🚪 Cerrar Sesión</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Panel de Control</h2>

    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card text-bg-primary h-100">
                <div class="card-body text-center">
                    <i class="bi bi-people-fill display-4"></i>
                    <h5 class="card-title mt-2">Clientes</h5>
                    <a href="/web/clientes" class="btn btn-light mt-2">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-bg-success h-100">
                <div class="card-body text-center">
                    <i class="bi bi-box-seam-fill display-4"></i>
                    <h5 class="card-title mt-2">Productos</h5>
                    <a href="/web/productos" class="btn btn-light mt-2">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-bg-warning h-100">
                <div class="card-body text-center">
                    <i class="bi bi-person-badge-fill display-4"></i>
                    <h5 class="card-title mt-2">Usuarios</h5>
                    <a href="/web/usuarios" class="btn btn-light mt-2">Gestionar</a>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card text-bg-info h-100">
                <div class="card-body text-center">
                    <i class="bi bi-cart-fill display-4"></i>
                    <h5 class="card-title mt-2">Ventas</h5>
                    <a href="/web/ventas" class="btn btn-light mt-2">Ver</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
