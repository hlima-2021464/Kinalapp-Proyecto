<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Venta - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🏠 KinalApp</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3">👤 <span th:text="${usuario.username}"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">🚪 Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3"><i class="bi bi-receipt"></i> Detalle de Venta #<span th:text="${venta.codigoVenta}"></span></h2>

    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            <h5>Información General</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <strong>Fecha:</strong>
                    <span th:text="${#dates.format(venta.fechaVenta, 'dd/MM/yyyy')}"></span>
                </div>
                <div class="col-md-3">
                    <strong>Cliente:</strong>
                    <span th:text="${venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente}"></span>
                    <br><small class="text-muted" th:text="${'DPI: ' + venta.cliente.dpiCliente}"></small>
                </div>
                <div class="col-md-3">
                    <strong>Vendedor:</strong>
                    <span th:text="${venta.usuario.username}"></span>
                    <br><small class="text-muted" th:text="${venta.usuario.email}"></small>
                </div>
                <div class="col-md-3">
                    <strong>Estado:</strong>
                    <span th:if="${venta.estado == 1}" class="badge bg-success">Completada</span>
                    <span th:if="${venta.estado == 0}" class="badge bg-danger">Anulada</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h5>Total: <span th:text="${'Q ' + #numbers.formatDecimal(venta.total, 1, 2)}" class="float-end"></span></h5>
        </div>
    </div>

    <div class="alert alert-warning mt-3">
        <i class="bi bi-exclamation-triangle"></i> Esta venta es de solo lectura. No se puede modificar.
    </div>

    <a href="/web/ventas" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left"></i> Volver al Listado
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
