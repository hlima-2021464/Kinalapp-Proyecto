<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 200px;
            height: auto;
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
            margin-top: 10px;
        }
        .logo-subtext {
            font-size: 14px;
            color: #6c757d;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-white text-center border-0 pt-4">
                        <div class="logo-container">
                            <img th:src="@{/images/kinalapplogo.png}" alt="KinalApp Logo" class="img-fluid">
                            <div class="logo-text">KINALAPP</div>
                            <div class="logo-subtext">DIGITAL PROGRESS</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                            </button>
                        </form>
                        
                        <hr>
                        
                        <div class="text-center">
                            <p class="mb-2">¿No tienes una cuenta?</p>
                            <a href="/registro" class="btn btn-outline-success w-100">
                                <i class="bi bi-person-plus"></i> Crear Cuenta
                            </a>
                        </div>
                    </div>
                    <div class="card-footer text-center text-muted">
                        <small>© 2024 KinalApp - Todos los derechos reservados</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
