<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - KinalApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🏠 KinalApp</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3">👤 <span th:text="${usuario.username}"></span></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">🚪 Salir</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3"><i class="bi bi-cart-fill"></i> Historial de Ventas</h2>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="alert alert-info">
        <i class="bi bi-info-circle"></i> Las ventas son de solo lectura. No se pueden modificar ni eliminar.
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Vendedor</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.codigoVenta}"></td>
                <td th:text="${#dates.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                <td th:text="${venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente}"></td>
                <td th:text="${venta.usuario.username}"></td>
                <td th:text="${'Q ' + #numbers.formatDecimal(venta.total, 1, 2)}"></td>
                <td>
                    <span th:if="${venta.estado == 1}" class="badge bg-success">Completada</span>
                    <span th:if="${venta.estado == 0}" class="badge bg-danger">Anulada</span>
                </td>
                <td>
                    <a th:href="@{/web/ventas/ver/{codigo}(codigo=${venta.codigoVenta})}"
                       class="btn btn-sm btn-info">
                        <i class="bi bi-eye"></i> Ver
                    </a>
                    <button class="btn btn-sm btn-danger"
                            onclick="mostrarMensajeNoDisponible()">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/dashboard" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left"></i> Volver al Dashboard
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function mostrarMensajeNoDisponible() {
        alert('⛔ BOTÓN NO DISPONIBLE\n\nLas ventas no se pueden eliminar por políticas del sistema.');
    }
</script>
</body>
</html>
