<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente.dpiCliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'">Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">🏠 KinalApp</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3">👤 <span th:text="${usuario.username}"></span></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">🚪 Salir</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 th:text="${cliente.dpiCliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/web/clientes/guardar}" method="post" th:object="${cliente}">
                        <input type="hidden" th:field="*{dpiCliente}" th:if="${cliente.dpiCliente != null}">

                        <div class="mb-3" th:if="${cliente.dpiCliente == null}">
                            <label for="dpiCliente" class="form-label">DPI</label>
                            <input type="text" class="form-control" id="dpiCliente" th:field="*{dpiCliente}"
                                   required pattern="[0-9]+" title="Solo números">
                        </div>

                        <div class="mb-3">
                            <label for="nombreCliente" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombreCliente" th:field="*{nombreCliente}" required>
                        </div>

                        <div class="mb-3">
                            <label for="apellidoCliente" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellidoCliente" th:field="*{apellidoCliente}" required>
                        </div>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">Dirección</label>
                            <textarea class="form-control" id="direccion" th:field="*{direccion}" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" th:field="*{estado}">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/web/clientes" class="btn btn-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
